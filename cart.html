<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Giỏ hàng</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-dark bg-dark">
<div class="container">
<a class="navbar-brand" href="product.html">SuperTechStore</a>
<a class="nav-link text-white" href="cart.html">
🛒 Cart (<span id="cart-count">0</span>)
</a>
</div>
</nav>

<main class="container my-5">
<h2>Giỏ hàng của bạn</h2>
<table class="table mt-4">
<thead>
<tr>
<th>Sản phẩm</th>
<th>Giá</th>
<th>Xóa</th>
</tr>
</thead>
<tbody id="cart-items"></tbody>
</table>

<h4 id="total"></h4>

<div class="mt-3">
    <button class="btn btn-danger" onclick="clearCart()">
        Xóa toàn bộ
    </button>

    <a href="index.html" class="btn btn-secondary">
        Tiếp tục mua hàng
    </a>

    <button class="btn btn-success" onclick="checkout()">
    Thanh toán
</button>
</div>
</main>

<script>
function getCart(){
    return JSON.parse(localStorage.getItem("cart")) || [];
}

function saveCart(cart){
    localStorage.setItem("cart", JSON.stringify(cart));
}

function updateCartCount(){
    let cart = getCart();
    document.getElementById("cart-count").innerText = cart.length;
}

function renderCart(){
    let cart = getCart();
    let tbody = document.getElementById("cart-items");
    let total = 0;
    tbody.innerHTML = "";

    cart.forEach((item, index) => {
        total += item.price;
        tbody.innerHTML += `
        <tr>
            <td>${item.name}</td>
            <td>${item.price.toLocaleString()}đ</td>
            <td>
                <button class="btn btn-sm btn-danger"
                onclick="removeItem(${index})">X</button>
            </td>
        </tr>
        `;
    });

    document.getElementById("total").innerText =
        "Tổng tiền: " + total.toLocaleString() + "đ";
}

function removeItem(index){
    let cart = getCart();
    cart.splice(index,1);
    saveCart(cart);
    renderCart();
    updateCartCount();
}

function clearCart(){
    localStorage.removeItem("cart");
    renderCart();
    updateCartCount();
}

document.addEventListener("DOMContentLoaded", function(){
    renderCart();
    updateCartCount();
});
function checkout(){

    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    if(cart.length === 0){
        alert("Giỏ hàng đang trống!");
        return;
    }

    let total = 0;
    cart.forEach(item=>{
        total += item.price;
    });

    if(confirm("Tổng tiền: " + total.toLocaleString() + "đ\nBạn có chắc muốn thanh toán không?")){
        
        alert("Thanh toán thành công 🎉");

        localStorage.removeItem("cart");

        // làm mới lại giao diện
        renderCart();
        updateCartCount();
    }
}
</script>

</body>
</html>
